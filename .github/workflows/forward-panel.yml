name: forward-panel (cloud failover)

# Redundancy for the local collector. Runs on GitHub's infra so snapshots keep
# flowing if the local machine is down. It is a FAILOVER, not a second primary:
# should_collect.py only lets it proceed when the newest snapshot in the repo is
# stale (local hasn't pushed recently), so a healthy local run means this job
# exits silently with no double-collection and no push race.
on:
  schedule:
    # every 15 min (UTC). GitHub may delay/coalesce scheduled runs under load;
    # the staleness gate tolerates that gracefully.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a collection even if the panel looks fresh (bypass the staleness gate)"
        type: boolean
        default: false

# Let the job commit the snapshot back to the repo.
permissions:
  contents: write

# Never let two cloud runs overlap (a delayed run + the next scheduled one).
concurrency:
  group: forward-panel-cloud
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so rotation/archives are intact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether to collect (failover gate)
        id: gate
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "forced collection requested -> bypassing staleness gate"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif python scripts/should_collect.py; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "10" ]; then
              echo "run=no" >> "$GITHUB_OUTPUT"
            else
              echo "gate errored (exit $code)"; exit "$code"
            fi
          fi

      - name: Collect + rotate + regenerate + push
        if: steps.gate.outputs.run == 'yes'
        env:
          GIT_AUTHOR_NAME: Arthur Breguez
          GIT_AUTHOR_EMAIL: 98524696+ArtBreguez@users.noreply.github.com
          GIT_COMMITTER_NAME: Arthur Breguez
          GIT_COMMITTER_EMAIL: 98524696+ArtBreguez@users.noreply.github.com
        run: |
          # Pull any local pushes that landed since checkout, then run the same
          # versioned collector the local cron uses (handles the 2026-11-10
          # cutoff, monthly rotation, cleaning, dashboard regen, and push).
          git pull --rebase --autostash origin master || true
          bash scripts/cron_forward.sh
