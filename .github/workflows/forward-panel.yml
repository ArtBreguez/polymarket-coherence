name: forward-panel (cloud failover)

# DISABLED as the automatic secondary collector (2026-08-25).
#
# Why: running this on a schedule alongside the local Hermes cron made BOTH
# collectors commit snapshots to master. Despite the staleness gate, their
# histories diverged (each saw a different "newest" once a push race started),
# the local push got blocked (ahead/behind), and origin/master went stale until
# manually reconciled — which tripped the panel watchdog. The redundancy only
# pays off if the local box is down, in which case the local watchdog is down
# too, so the automatic failover bought little for the divergence risk it added.
#
# The scheduled trigger is removed so there is a SINGLE writer (local cron). The
# manual workflow_dispatch is kept: if the local box is genuinely down, trigger
# this by hand (optionally force=true) to collect from the cloud until local is
# back. Re-enable the schedule only if the two writers are moved to separate
# branches with a periodic union-merge.
on:
  # schedule:
  #   - cron: "*/15 * * * *"   # disabled: single-writer policy (see note above)
  workflow_dispatch:
    inputs:
      force:
        description: "Force a collection even if the panel looks fresh (bypass the staleness gate)"
        type: boolean
        default: false

# Let the job commit the snapshot back to the repo.
permissions:
  contents: write

# Never let two cloud runs overlap (a delayed run + the next scheduled one).
concurrency:
  group: forward-panel-cloud
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so rotation/archives are intact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether to collect (failover gate)
        id: gate
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "forced collection requested -> bypassing staleness gate"
            echo "run=yes" >> "$GITHUB_OUTPUT"
          elif python scripts/should_collect.py; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "10" ]; then
              echo "run=no" >> "$GITHUB_OUTPUT"
            else
              echo "gate errored (exit $code)"; exit "$code"
            fi
          fi

      - name: Collect + rotate + regenerate + push
        if: steps.gate.outputs.run == 'yes'
        env:
          GIT_AUTHOR_NAME: Arthur Breguez
          GIT_AUTHOR_EMAIL: 98524696+ArtBreguez@users.noreply.github.com
          GIT_COMMITTER_NAME: Arthur Breguez
          GIT_COMMITTER_EMAIL: 98524696+ArtBreguez@users.noreply.github.com
        run: |
          # Pull any local pushes that landed since checkout, then run the same
          # versioned collector the local cron uses (handles the 2026-11-10
          # cutoff, monthly rotation, cleaning, dashboard regen, and push).
          git pull --rebase --autostash origin master || true
          bash scripts/cron_forward.sh
