name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests (no network)
        run: python tests/test_core.py
      - name: Syntax-check all scripts
        run: python -m py_compile scripts/*.py
